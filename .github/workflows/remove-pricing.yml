name: Update date-page options

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, 'Update date-page options') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Update venue and selection options
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()

          # Keep Long Drive visible regardless of food selection.
          s = s.replace(
              "function chosenVenues(){return venues.filter(v=>v.foods.some(f=>selectedFoods.has(f)))}",
              "function chosenVenues(){return venues.filter(v=>v.id==='longdrive'||v.foods.some(f=>selectedFoods.has(f)))}"
          )

          # Make food/date-style selection exclusive: choosing a new option
          # automatically deselects the previous one.
          s = re.sub(
              r"let selectedFoods=new Set\(\['Maharashtrian'\]\)",
              "let selectedFoods=new Set(['Maharashtrian'])",
              s,
              count=1
          )
          old_handler = "const f=c.dataset.food;if(selectedFoods.has(f)){if(selectedFoods.size===1){toast('Keep at least one food option. 😌');return}selectedFoods.delete(f)}else selectedFoods.add(f);renderFoods();renderVenues();updateSummary();$('#places').scrollIntoView({behavior:'smooth'})"
          new_handler = "const f=c.dataset.food;if(selectedFoods.has(f)){toast('That one is already selected. Pick another option to switch. 😌');return}else{selectedFoods=new Set([f]);selectedVenue=null}renderFoods();renderVenues();updateSummary();$('#places').scrollIntoView({behavior:'smooth'})"
          s = s.replace(old_handler, new_handler)

          # Limit date selection to today through the same date next month.
          s = s.replace(
              "const today=new Date();today.setHours(0,0,0,0);",
              "const today=new Date();today.setHours(0,0,0,0);const maxDate=new Date(today);maxDate.setMonth(maxDate.getMonth()+1);"
          )
          s = s.replace(
              "const dis=dt<today;",
              "const dis=dt<today||dt>maxDate;"
          )
          s = s.replace(
              "$('#next').addEventListener('click',()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);renderCalendar()});",
              "$('#next').addEventListener('click',()=>{const maxMonth=new Date(maxDate.getFullYear(),maxDate.getMonth(),1);const x=new Date(view.getFullYear(),view.getMonth()+1,1);if(x<=maxMonth){view=x;renderCalendar()}});"
          )
          s = s.replace(
              "Pick a day and a time. The calendar always starts from today.",
              "Pick a day and a time. The calendar shows today through the same date next month."
          )

          p.write_text(s)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Update date-page options [skip ci]"
          git push
